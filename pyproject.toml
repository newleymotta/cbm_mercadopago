[project]
name = "cbm_mercadopago"
authors = [{ name = "Clinica Medica Bernardo Motta", email = "clinicabernardomotta@gmail.com" }]
description = "Integração Mercado Pago (Checkout Pro) para Frappe Health"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
indent-style = "tab"
